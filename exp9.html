<!DOCTYPE html> 
<html lang="en"> 
<head> 
  <meta charset="UTF-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <title>Responsive Product Grid</title> 
  <style> 
    body { 
      font-family: Arial, sans-serif; 
      margin: 0; 
      background: #f5f5f5; 
      padding: 20px; 
      font-size: 70px;
    } 
 
    h2 { 
      text-align: center; 
      margin-bottom: 20px; 
      background-color: aquamarine;
    } 
  
    .grid { 
      display: grid; 
      grid-template-columns: repeat(4, 1fr); /* 4 columns for large screens */ 
      gap: 20px; 
    } 
 
    .card { 
      background: #fff; 
      border-radius: 8px; 
      box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
      padding: 16px; 
      text-align: center; 
    } 
 
    .card img { 
      width: 100%; 
      height: auto; 
      object-fit: cover; 
      border-radius: 6px; 
      margin-bottom: 10px; 
    } 
 
    .card h3 { 
      font-size: 18px; 
      margin: 8px 0; 
    } 
 
    .card p { 
      font-size: 14px; 
      color: #555; 
      margin: 4px 0; 
    } 
 
    .price { 
      font-weight: bold; 
      color: #007bff; 
    } 
 
    /* Responsive Breakpoints */ 
    @media (max-width: 1024px) { 
      .grid { 
        grid-template-columns: repeat(2, 1fr); /* 2 columns for tablets */ 
        
      } 
    } 
 
    @media (max-width: 600px) { 
      .grid { 
        grid-template-columns: 1fr; /* 1 column for mobile */ 
      } 
    } 
  </style> 
</head> 
<body> 
  <h2>Responsive Product Grid</h2> 
  
<div class="grid"> 
    <div class="card"> 
      <img src="headphone.jpg" alt="Head Phone"> 
      <h3>Head Phone</h3> 
      <p>Best head phone with great features.</p> 
      <p class="price">₹698</p> 
    </div> 
 
    <div class="card"> 
      <img src="tshirt.jpg" alt="T-Shirt" sizes="100%"> 
      <h3>T-Shirt</h3> 
      <p>Durable and stylish for daily use.</p> 
      <p class="price">₹899</p> 
    </div> 
 
    <div class="card"> 
      <img src="shoe.avif" alt="Shoes"> 
      <h3>AIR Zoom</h3> 
      <p>Lightweight and comfortable.</p> 
      <p class="price">₹1,599</p> 
    </div> 
 
    <div class="card"> 
      <img src="https://img.freepik.com/premium-photo/modern-laptop-wooden-floor-with-blue-red-neon-light_175682-13031.jpg?semt=ais_hybrid&w=740&q=80" alt="Laptop"> 
      <h3>Acer Spire Lite ryzen 5</h3> 
      <p>Trendy design with premium quality.</p> 
      <p class="price">₹43,999</p> 
    </div> 
  </div> 
</body> 
</html>
